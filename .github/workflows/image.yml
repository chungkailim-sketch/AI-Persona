name: Build image
on:
  push:
    branches: [claude/remote-control-bsw4r2, main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chungkailim-sketch/ai-persona:latest
            ghcr.io/chungkailim-sketch/ai-persona:${{ github.sha }}
